[Settings]
; master switch for the whole module
enabled=true
; refund the placed item back to the player when a placement is blocked/destroyed
giveback=true
; limit how many ramps can stack on the same foundation/ceiling (see RampStackMax)
rampstackcheck=true
; legacy check covering three placements by raw collider name:
;   - Pillar/Foundation/Ramp near a woodbox/smallstash/door (overlaps with
;     AntiPillarStash/AntiFoundationHide/AntiRampObject below, kept independent
;     since this matches by name and those match by component type)
;   - Door near a woodbox (not covered anywhere else)
;   - SmallStash placed next to a woodbox, another stash, or a door, to stop
;     players disguising loot (not covered anywhere else)
structurecheck=true
; block players from spawning/teleporting inside rock terrain
RockGlitch=true
; kill the player (instead of just warning) when caught rock glitching via spawn/teleport
RockGlitchKill=true
; gate AntiRampObject below behind ramp-on-loot detection
CheckForRampLoot=true
; block pillars placed next to a Barricade_Fence deployable specifically
BarricadePillarGlitchDetection=true
; admins skip every check in this module
AdminBypass=false
; players holding the "glitchfix.bypass" permission skip every check in this module
PermissionBypass=false
; block foundations placed on top of a deployable or character (hiding loot under floors)
AntiFoundationHide=true
; block pillars placed directly on top of any deployable (pillar-stash glitch)
AntiPillarStash=true
; block ramps placed on top of a deployable or character (requires CheckForRampLoot=true)
AntiRampObject=true
; block a SmallStash hidden inside a doorway (door-stash glitch)
AntiDoorStash=false
; destroy a dead animal corpse after AnimalHitsBeforeDestroy bullet hits (animal-glitch)
AntiAnimalGlitch=false
; destroy nearby sleeping bags when a rock-glitch attempt is caught
RockGlitchDestroySleepingBag=true
; block foundations/ramps placed inside rock terrain (see InRock check)
PreventBuildInRock=true
; max ramps allowed stacked on the same foundation/ceiling before extras are destroyed
RampStackMax=1
; number of bullet hits a dead animal takes before it's destroyed (AntiAnimalGlitch)
AnimalHitsBeforeDestroy=5
; sphere radius (meters) used by AntiFoundationHide
FoundationHideRadius=4.5
; sphere radius (meters) used by AntiPillarStash
PillarStashRadius=0.40
; sphere radius (meters) used by AntiRampObject
RampObjectRadius=3.5
; name shown as the sender of chat messages from this module
SystemName=Server
; message sent to the player when a foundation/pillar/ramp hide attempt is blocked, {0} = detected object name
FoundationHideMessage=You cannot place structures on deployables here ({0})
; message sent to the player when a rock-glitch build attempt is blocked
RockBuildMessage=You are not allowed to build in rocks
; message sent to the player when a pillar-barricade glitch attempt is blocked
PillarBarricadeMessage=Pillar Barricade glitching is not allowed!