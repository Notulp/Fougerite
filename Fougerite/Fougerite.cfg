[Fougerite]
; uncomment to disable Fougerite, to disable version announce at login,
; or to enable structure and deployed item decay
;enabled=false
;tellversion=false
;deployabledecay=true
;structuredecay=true
;
; Remove players from cache after they disconnect.
RemovePlayersFromCache=false
; If a player sends an invalid packet (Possibly hacker) ban him.
BanOnInvalidPacket=true
; Enable Default Rust Decay? (May cause problems or laggs after a huge map.)
EnableDefaultRustDecay=true
; Autoban people for Crafting Hack? (If this is disabled, the crafting will be only cancelled/logged.)
AutoBanCraft=true
; How many connections can be made from the same IP / 3 seconds?
FloodConnections=2
; How many minutes shall pass until the server saves everything?
SaveTime=10
; How many copies should the server make of the save files, before deleting them? Do not set this below 5.
SaveCopies=5
; Stop Server on Saving failure?
StopServerOnSaveFail=false
; Ensure that manual save won't be executed, if the server is going to autosave? How many minutes should be the critical point
; where the manual save won't run if less than X minutes is left before autosave? This should be LESS than 'SaveTime'. 0 to disable.
CrucialSavePoint=0
; Text to display to the player when the server is saving, and the building parts cannot be placed due the subthread.
SaveNotification=The server is currently saving! You have to wait before placing an object.
; Enable the default ChatSystem output for the Player.Message methods?
RustChat=true
; Send additional RPCPackets of the chat for the clients? (This is recommended for RustBuster Servers only.)
RPCChat=false
; Specify the client side's RPC method.
ClientFunction=FougeriteChatSystem
; Enable intensive events for script plugins (Py, Lua, JS)
; This gives scripts access to events like OnPlayerMove, OnShoot, OnShotgunShoot, OnBowShoot, OnAnimalMovement,
; OnHeatZoneEnter, OnWorkZoneEnter.
; Use this carefully, as these events are called very often and may cause performance issues (server laggs).
; It is recommended to use C# plugins for these events instead.
; Script plugins are generally slower than C# plugins. Python is the fastest among script plugins.
; Use at your own risk.
EnableScriptPluginsIntensiveEvents=false
; Suppress the default "Fougerite: Class.Function was executed!" response 
; when a console command doesn't explicitly specify a reply text?
SilentConsoleCommands=false
; Specifies the name of the message displayed by the server for system notifications.
; This value is typically configurable and determines the title or identifier of server broadcast messages.
ServerMessageName=Fougerite
; Setting this to true will disable truth.punish, Facepunch's original speedhack and flyhack validations
; You may disable this setting on a RustBuster server.
DisableFacePunchTruthPunish=false
; Steam login check. Decides who may join when Steam itself rejects a player's login ticket.
; This affects RustBuster players on Spacewar (AppID 480) and cracked players.
; Players on the real Rust AppID (252490) are always verified by Steam and can join in every mode.
; Pick one value from the table, they are sorted from most secure to least secure.
; Value                    Who can join besides real Rust players   API key   Steam profile requirement
; RustOnly                 nobody                                   no        none
; RustOwners               Spacewar players that own Rust           yes       'Game details' must be Public
; SteamPaidAccounts        Spacewar players on a paid account       yes       a Community profile must exist, private is fine, spent minimum 5$
; SteamAccounts            any real Steam account on Spacewar       yes       none
; SteamAccountsUnverified  Spacewar tickets that look valid         no        none
; AllowAll                 everyone, even without Steam             no        none
; Legacy                   decided by plugins such as AuthAllow     no        none
; Recommended for RustBuster servers is SteamAccounts.
; A paid account is one that spent at least 5 USD on Steam, so Steam does not treat it as a limited account.
; RustOwners rejects players with private game details even when they own Rust.
; SteamAccountsUnverified checks tickets offline only. It stops broken emulators, but a well made fake ticket can join as any SteamID.
; Plugins can always kick a player the mode allows. Outside Legacy, plugins cannot let in a player the mode rejects.
SteamAuthMode=Legacy
; Your Steam Web API key, get one at https://steamcommunity.com/dev/apikey
; Only used by RustOwners, SteamPaidAccounts and SteamAccounts. Keep it secret.
SteamWebAPIKey=
; Seconds to wait for each answer from Steam, between 1 and 45.
; Spacewar players wait for this check while connecting, normally it takes well under a second.
; If Steam is slow, a join can take up to this value plus about 6 seconds,
; or twice this value plus about 6 seconds with RustOwners and SteamPaidAccounts.
SteamWebAPITimeout=10
; What happens to Spacewar players when Steam cannot be reached (Steam down, rate limited or too slow).
; false rejects them, which is the safe choice.
; true lets them in unchecked, which also lets fake tickets in for as long as Steam is unreachable.
; Only used by RustOwners, SteamPaidAccounts and SteamAccounts. A wrong API key always rejects, whatever this says.
SteamWebAPIFailOpen=false

[Modules]
;module = folder
; if a module needs no folder, just use any word, or no word
; you can change folder names to suit your needs
; only modules listed in [Modules] are loaded
; comment out a module to disable it
; Запись должна быть следующего вида: имя_модуля=папка_для_конфигов
; Загружаются только модули, перечисленные в разделе [Modules] 
; Закомментируйте строку с плагином чтобы отключить его
RustPP=Rust++
GlitchFix=GlitchFix
PermissionManager=PermissionManager

[Engines]
EnableCSharp=true
EnablePython=true
EnableJavaScript=false
EnableLua=false

[Logging]
; Fougerite logs are in PublicFolder\Logs
; Putting these false will still do the logging, but
; the console won't display them
debug=false
error=true
exception=true
; This enables tracing all RPC calls (may produce a lot of logs)
; coming from any client, useful to debug client-server communication
; hacks, floods, etc. The call is manually patched in ULink.dll Class4
rpctracer=false
